spring.application.name=tallerbicicletas
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/taller_bicicletas?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Respeta los datos existentes y actualiza el esquema según las entidades definidas
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL generadas por Hibernate en la consola para facilitar la depuración 
spring.jpa.show-sql=${SHOW_SQL:true}
#  Formatea las consultas SQL para mejorar su legibilidad en la consola 
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=${PORT:8080}
# Configura el formato de fecha para la serialización/deserialización de objetos Date en JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Configura el origen permitido para las solicitudes CORS, ajusta según el puerto del frontend
app.cors.origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}